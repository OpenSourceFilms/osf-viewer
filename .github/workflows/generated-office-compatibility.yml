name: Generated Office candidate compatibility (isolated)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generated-office-compatibility.yml"
      - "scripts/generate_clean_office_candidates.py"
      - "scripts/verify_generated_office_compatibility.py"
      - "scripts/record_generated_office_evidence.py"
      - "scripts/audit_generated_template_inheritance.py"
      - "tests/test_generated_template_inheritance.py"
      - "tests/test_generated_office_evidence.py"
      - "docs/GENERATED_OFFICE_NOTICES.md"
      - "docs/third_party/APACHE-2.0-odfpy.txt"
      - "scripts/audit_generated_office_components.py"
      - "scripts/audit_generated_legacy_components.py"
      - "tests/test_generated_legacy_component_audit.py"
      - "tests/test_generated_office_component_audit.py"
      - "scripts/verify_fixture_manifest.py"
      - "scripts/audit_fixture_packages.py"
      - "tests/test_office_extract.py"
      - "tests/fixtures/**"
      - "docs/fixture-inventory.json"
      - "office_extract.py"
      - "inspectors.py"
      - "cache.py"
      - "requirements.lock.txt"
  pull_request:
    paths:
      - ".github/workflows/generated-office-compatibility.yml"
      - "scripts/generate_clean_office_candidates.py"
      - "scripts/verify_generated_office_compatibility.py"
      - "scripts/record_generated_office_evidence.py"
      - "scripts/audit_generated_template_inheritance.py"
      - "tests/test_generated_template_inheritance.py"
      - "tests/test_generated_office_evidence.py"
      - "docs/GENERATED_OFFICE_NOTICES.md"
      - "docs/third_party/APACHE-2.0-odfpy.txt"
      - "scripts/audit_generated_office_components.py"
      - "scripts/audit_generated_legacy_components.py"
      - "tests/test_generated_legacy_component_audit.py"
      - "tests/test_generated_office_component_audit.py"
      - "scripts/verify_fixture_manifest.py"
      - "scripts/audit_fixture_packages.py"
      - "tests/test_office_extract.py"
      - "tests/fixtures/**"
      - "docs/fixture-inventory.json"
      - "office_extract.py"
      - "inspectors.py"
      - "cache.py"
      - "requirements.lock.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout published Viewer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Python 3.12 required by pinned NumPy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Office conversion runtime if missing
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
          fi
          libreoffice --version
      - name: Install exact published Viewer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Install audit-only OLE2 reader
        run: python -m pip install --disable-pip-version-check --no-deps "olefile==0.47"
      - name: Test legacy OLE2 and RTF fail-closed checks
        run: python -B -m unittest discover -s tests -p "test_generated_legacy_component_audit.py" -v
      - name: Test generated-component inventory rejection paths
        run: python -B -m unittest discover -s tests -p "test_generated_office_component_audit.py" -v
      - name: Verify template ZIP inheritance and archive safeguards
        run: python -B -m unittest discover -s tests -p "test_generated_template_inheritance.py" -v
      - name: Verify exact-file provenance record invariants
        run: python -B -m unittest discover -s tests -p "test_generated_office_evidence.py" -v
      - name: Exercise all original Office assertions against candidate files
        env:
          OSF_OFFICE_EVIDENCE_PATH: ${{ runner.temp }}/viewer-office-evidence.json
        run: python -B scripts/verify_generated_office_compatibility.py
      - name: Retain JSON evidence only, never generated Office binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: viewer-office-evidence
          path: ${{ runner.temp }}/viewer-office-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Recheck unmodified published fixture bytes
        run: python -B scripts/verify_fixture_manifest.py
