name: Viewer path safety (offline)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/path-safety.yml"
      - "security.py"
      - "tests/test_security_symlink_denials.py"
      - "tests/test_fixture_package_safety.py"
      - "tests/fixtures/**"
      - "scripts/audit_fixture_packages.py"
      - "docs/fixture-inventory.json"
      - "scripts/verify_fixture_manifest.py"
      - "tests/test_fixture_manifest_gate.py"
      - "requirements.lock.txt"
      - "DEPENDENCY_LICENSES.md"
      - "tests/test_dependency_licence_inventory.py"
      - "app.py"
      - "tests/test_http_error_redaction.py"
      - "archive_memory.py"
      - "inspectors.py"
      - "tests/test_7z_memory_extraction.py"
      - "tests/test_archive_member_bounds.py"
      - "tests/test_tar_header_scan_bounds.py"
      - "request_limits.py"
      - "tests/test_worker_admission.py"
      - "tests/test_denylist_fail_closed.py"
      - "tests/test_inspector_error_redaction.py"
      - "tests/test_native_pdf_streaming.py"
      - "directory_listing.py"
      - "tests/test_bounded_directory_listing.py"
      - "denylist.txt"
  pull_request:
    paths:
      - ".github/workflows/path-safety.yml"
      - "security.py"
      - "tests/test_security_symlink_denials.py"
      - "tests/test_fixture_package_safety.py"
      - "tests/fixtures/**"
      - "scripts/audit_fixture_packages.py"
      - "docs/fixture-inventory.json"
      - "scripts/verify_fixture_manifest.py"
      - "tests/test_fixture_manifest_gate.py"
      - "requirements.lock.txt"
      - "DEPENDENCY_LICENSES.md"
      - "tests/test_dependency_licence_inventory.py"
      - "app.py"
      - "tests/test_http_error_redaction.py"
      - "archive_memory.py"
      - "inspectors.py"
      - "tests/test_7z_memory_extraction.py"
      - "tests/test_archive_member_bounds.py"
      - "tests/test_tar_header_scan_bounds.py"
      - "request_limits.py"
      - "tests/test_worker_admission.py"
      - "tests/test_denylist_fail_closed.py"
      - "tests/test_inspector_error_redaction.py"
      - "tests/test_native_pdf_streaming.py"
      - "directory_listing.py"
      - "tests/test_bounded_directory_listing.py"
      - "denylist.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-path-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pin Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test denied symlink and root escape boundaries
        run: python -B -m unittest discover -s tests -p "test_security_symlink_denials.py" -v
      - name: Audit public Office fixture package boundaries
        run: python -B -m unittest discover -s tests -p "test_fixture_package_safety.py" -v
      - name: Require review for new or modified published fixture binaries
        run: python -B -m unittest discover -s tests -p "test_fixture_manifest_gate.py" -v
      - name: Verify published binary inventory against Git blob digests
        run: python -B scripts/verify_fixture_manifest.py
      - name: Check dependency licence register against all 21 locked packages
        run: python -B -m unittest discover -s tests -p "test_dependency_licence_inventory.py" -v
      - name: Verify safe public HTTP errors without opening sockets
        run: python -B -m unittest discover -s tests -p "test_http_error_redaction.py" -v
      - name: Install exact published py7zr security release
        run: python -m pip install --disable-pip-version-check "py7zr==1.1.4"
      - name: Verify real 7z decoding without on-disk extraction
        run: python -B -m unittest discover -s tests -p "test_7z_memory_extraction.py" -v
      - name: Verify TAR symlink rejection and ZIP/TAR actual size caps
        run: python -B -m unittest discover -s tests -p "test_archive_member_bounds.py" -v
      - name: Ensure TAR header scan itself is bounded
        run: python -B -m unittest discover -s tests -p "test_tar_header_scan_bounds.py" -v
      - name: Exercise bounded worker admission via disposable loopback server
        run: python -B -m unittest discover -s tests -p "test_worker_admission.py" -v
      - name: Refuse missing or incomplete Viewer access policies
        run: python -B -m unittest discover -s tests -p "test_denylist_fail_closed.py" -v
      - name: Keep inspector parse failures out of public text reports
        run: python -B -m unittest discover -s tests -p "test_inspector_error_redaction.py" -v
      - name: Verify native PDF streaming never loads entire file
        run: python -B -m unittest discover -s tests -p "test_native_pdf_streaming.py" -v
      - name: Verify bounded-memory deny-safe HTML and text directory listings
        run: python -B -m unittest discover -s tests -p "test_bounded_directory_listing.py" -v
